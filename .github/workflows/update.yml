name: Auto Update IPTV

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# 新增权限配置，允许 GitHub Actions 向当前仓库写入生成的文件
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 升级为 v4/v5 版本，消除 Node.js 弃用警告
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install requests
    - name: Run Python script
      run: python update.py
- name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 使用 git add . 代替 git add *.txt，这样即使没生成新文件也不会报错
        git add .
        # 如果没有文件变动，就输出提示并继续，不要当做错误中断
        git commit -m "Auto update live sources" || echo "No changes to commit"
        git push
